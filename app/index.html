body.light{

:root{--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--body:"Sarabun","TH Sarabun New",-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .2s,color .2s}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.bar{display:flex;align-items:center;gap:11px;padding:8px 15px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.brand i{width:5px;height:19px;background:var(--hero);border-radius:1px}

.vb{font-family:var(--mono);font-size:10px;padding:5px 9px;background:transparent;border:1px solid var(--line);border-radius:3px;color:var(--ink2);transition:.12s;white-space:nowrap}
.vb:hover{border-color:var(--ink3);color:var(--ink)}
.vb[aria-pressed="true"]{background:var(--panel2);border-color:var(--hero);color:var(--ink)}
.vb:focus-visible{outline:2px solid var(--hero);outline-offset:1px}
.right{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.body{display:grid;grid-template-columns:minmax(0,1fr) 360px;overflow:hidden}
@media (max-width:1060px){.body{grid-template-columns:1fr}.side{display:none}}
.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,var(--stage1) 0%,var(--stage2) 72%)}
svg#scene{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#scene.drag{cursor:grabbing}
.hint{position:absolute;left:13px;bottom:11px;font-family:var(--mono);font-size:9.5px;color:var(--ink3);pointer-events:none}
.hint b{color:var(--ink2);font-weight:400}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;z-index:5}
.tip.on{opacity:1}
.tip div{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 9px;font-family:var(--mono);font-size:10px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.tip .a{color:var(--ink)} .tip .b{color:var(--ink3);font-size:9px}
.side{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;overscroll-behavior:contain}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h2{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px;font-weight:500;display:flex;align-items:baseline;gap:6px}
.sec h2 em{font-style:normal;margin-left:auto;letter-spacing:0;text-transform:none;font-family:var(--body);font-size:10px}
.row{display:flex;align-items:center;gap:7px;padding:4px 5px;border:0;background:transparent;width:100%;text-align:left;border-radius:3px;transition:.1s}
.row:hover{background:var(--panel2)}
.row[aria-pressed="false"]{opacity:.3}
.row:focus-visible{outline:2px solid var(--hero);outline-offset:-2px}
.dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.row .c{font-family:var(--mono);font-size:9.5px;width:19px;color:var(--ink2)}
.row .n{font-size:11.5px;color:var(--ink2)}
.row .m{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--ink3)}
.tw{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);background:transparent;width:100%;text-align:left;border-radius:3px;margin-bottom:4px;transition:.12s}
.tw:hover{border-color:var(--ink3)}
.tw[aria-pressed="true"]{border-color:var(--hero);background:var(--panel2)}
.tw[aria-pressed="false"]{opacity:.42}
.tw:focus-visible{outline:2px solid var(--hero);outline-offset:1px}
.tw b{font-size:12px;font-weight:600}
.tw em{font-style:normal;font-size:10.5px;color:var(--ink3);display:block}
.tw .k{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink3);text-align:right}
.pair{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.pb{font-family:var(--mono);font-size:9.5px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--ink2)}
.pb:hover{border-color:var(--ink3);color:var(--ink)}
.det{padding:12px 14px}
.det .empt{color:var(--ink3);font-size:11.5px;line-height:1.75}
.adr{font-family:var(--mono);font-size:12.5px;font-weight:600}
.tags{display:flex;gap:4px;margin:6px 0 9px;flex-wrap:wrap}
.tg{font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--ink2)}

body.light .tg.sup{background:#EAF6F1;border-color:#5DCAA5;color:#0B4A3B}
body.dark .tg.core{background:#12463A;border-color:#1D7A63;color:#8FE3C6}
body.dark .tg.sup{background:#123A34;border-color:#1B5F51;color:#7FCBB4}
.tg.ref{background:var(--panel2);color:var(--ink3)}
.det h3{font-size:13.5px;font-weight:600;line-height:1.4;margin-bottom:5px}
.det p{font-size:11.5px;color:var(--ink2);line-height:1.62}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:9px;font-size:11px}
.kv b{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:500;padding-top:2px;white-space:nowrap}
.kv span{color:var(--ink2);line-height:1.5}
.sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}

.seambox p{font-size:11.5px;line-height:1.6}

.seambox .mini i{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ends{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center;margin-top:10px}
.end{border:1px solid var(--line);border-radius:4px;padding:8px 9px;background:var(--panel);text-align:left;transition:.12s}

.end .tk{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);display:block}
.end .ad{font-family:var(--mono);font-size:11px;font-weight:600;display:block;margin-top:2px}
.end .ax{font-size:10.5px;color:var(--ink2);display:block;line-height:1.4;margin-top:2px}
.arrw{font-family:var(--mono);font-size:14px;color:var(--ink3)}
.lk{display:flex;align-items:flex-start;gap:7px;background:transparent;border:0;padding:6px;width:100%;text-align:left;border-radius:3px;transition:.1s;margin-top:1px}
.lk:hover{background:var(--panel2)}
.lk:focus-visible{outline:2px solid var(--hero);outline-offset:-2px}
.lk .r{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);width:58px;flex-shrink:0;padding-top:2px}
.lk .t{flex:1;min-width:0}
.lk .a{font-family:var(--mono);font-size:10.5px;color:var(--ink);display:block}
.lk .w{font-size:10.5px;color:var(--ink3);line-height:1.45;display:block;margin-top:1px}
.stat{display:flex;flex-wrap:wrap;gap:9px;font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-top:7px}
.stat b{color:var(--ink);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  const X=u-CU,Y=v-CV,a=S.az;
  const Xr=X*Math.cos(a)-Y*Math.sin(a),Yr=X*Math.sin(a)+Y*Math.cos(a);

  if(!towerOn(a.T.k)||!towerOn(b.T.k))return false;

function nbrs(c){
  const T=c.T,o=[],li=T.ls.findIndex(l=>l[0]===c.lc);
  const mk=(r,l,xi,yi)=>{
    if(l<0||l>=T.ls.length||xi<0||xi>=T.xs.length||yi<0||yi>=T.ys.length)return;
    const id=`${T.k}.${T.ls[l][0]}.${T.xs[xi][0]}.${T.ys[yi][0]}`;
    if(BY[id]&&BY[id].lvl>0)o.push({r,id});};

  mk("y ↑",li,c.xi,c.yi-1);mk("y ↓",li,c.xi,c.yi+1);

    O.push(`<g class="twl" data-tw="${T.k}" style="cursor:pointer">
      <text x="${q.x.toFixed(1)}" y="${q.y.toFixed(1)}" text-anchor="middle" font-family="var(--mono)" font-size="${T.hero?12:11}" font-weight="600" fill="${T.hero?"var(--hero)":"var(--ink2)"}">${T.name}</text>
      <text x="${q.x.toFixed(1)}" y="${(q.y+13).toFixed(1)}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink3)">${T.ls.length}L × ${T.xs.length} × ${T.ys.length} = ${T.ls.length*T.xs.length*T.ys.length}</text></g>`);});
  if(S.seams){
    SEAMS.forEach((s,i)=>{
      if(!seamOn(s))return;
      const a=BY[s[0]],b=BY[s[1]];
      const p1=proj(a.T.u0+a.xi,a.T.v0+a.yi,a.pam),p2=proj(b.T.u0+b.xi,b.T.v0+b.yi,b.pam);
      const on=!anySel||S.selS===i||(selC&&selC.seams.includes(i));
      const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2-34*S.zoom;
      const d=`M${p1.x.toFixed(1)} ${p1.y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
      O.push(`<path class="sl" data-si="${i}" d="${d}" fill="none" stroke="transparent" stroke-width="14" style="cursor:pointer;pointer-events:stroke"/>`);
      O.push(`<path d="${d}" fill="none" pointer-events="none" stroke="var(--c${s[2]})" stroke-width="${S.selS===i?2.8:(on?1.5:0.7)}" stroke-opacity="${on?t.lnOn:t.lnOff}" stroke-dasharray="${s[6]?"6 4":""}"/>`);
      if(S.selS===i){
        O.push(`<text x="${mx.toFixed(1)}" y="${(my-6).toFixed(1)}" text-anchor="middle" font-family="var(--mono)" font-size="10" font-weight="600" fill="var(--c${s[2]})">${s[2]} · ${s[3].slice(0,34)}</text>`);
      }
    });
  }
  if(selC){
    const p0=proj(selC.T.u0+selC.xi,selC.T.v0+selC.yi,selC.pam);
    nbrs(selC).forEach(n=>{const x=BY[n.id],q=proj(x.T.u0+x.xi,x.T.v0+x.yi,x.pam);
      O.push(`<line x1="${p0.x.toFixed(1)}" y1="${p0.y.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}" stroke="${t.nbr}" stroke-opacity="${t.nbrOp}" stroke-width="1.2"/>`);});
    O.push(`<text x="${p0.x.toFixed(1)}" y="${(p0.y-15).toFixed(1)}" text-anchor="middle" font-family="var(--mono)" font-size="10" font-weight="600" fill="var(--ink)">${selC.lc}.${selC.xc}.${selC.yc}</text>`);
  }
  svg.innerHTML=O.join("");
}
/* ============ interaction ============ */
let drag=false,lx=0,moved=0;
svg.addEventListener("pointerdown",e=>{drag=true;S.dragging=true;moved=0;lx=e.clientX;svg.classList.add("drag");svg.setPointerCapture(e.pointerId);});
svg.addEventListener("pointermove",e=>{
  if(drag){const dx=e.clientX-lx;moved+=Math.abs(dx);lx=e.clientX;S.az+=dx*0.0062;req();return;}
  const tip=document.getElementById("tip"),r=svg.getBoundingClientRect();
  const n=e.target.closest(".nd"),l=e.target.closest(".sl");
  if(n||l){
    tip.classList.add("on");tip.style.left=(e.clientX-r.left+13)+"px";tip.style.top=(e.clientY-r.top+11)+"px";
    if(n){const c=BY[n.dataset.id];
      tip.querySelector(".a").textContent=c.T.k+" · "+c.lc+"."+c.xc+"."+c.yc;
      tip.querySelector(".b").textContent="L"+c.pam+" "+c.ln+(c.seams.length?" · "+c.seams.length+" coupling":"")+(c.T.hero?" · "+LVN[c.lvl]:"");
    }else{const s=SEAMS[+l.dataset.si];
      tip.querySelector(".a").textContent="ชนิด "+s[2]+" · "+s[3];
      tip.querySelector(".b").textContent=BY[s[0]].T.k+"."+BY[s[0]].lc+" ↔ "+BY[s[1]].T.k+"."+BY[s[1]].lc+" · คลิกเพื่อดูรายละเอียด";}
  }else tip.classList.remove("on");
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>svg.addEventListener(ev,()=>{drag=false;if(S.dragging){S.dragging=false;req();}svg.classList.remove("drag");}));
svg.addEventListener("wheel",e=>{e.preventDefault();S.zoom=Math.max(.5,Math.min(2.6,S.zoom*(1-e.deltaY*0.0012)));req();},{passive:false});
svg.addEventListener("click",e=>{
  if(moved>6)return;
  const n=e.target.closest(".nd");
  if(n){S.selS=null;S.sel=(S.sel===n.dataset.id?null:n.dataset.id);detail();req();return;}
  const l=e.target.closest(".sl");
  if(l){const i=+l.dataset.si;S.sel=null;S.selS=(S.selS===i?null:i);detail();req();return;}
  const t=e.target.closest(".twl");if(t){S.tw=new Set([t.dataset.tw]);S.sel=null;S.selS=null;syncUI();stats();detail();req();return;}
  S.sel=null;S.selS=null;detail();req();
});
let pend=false;function req(){if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;draw();});}
document.querySelectorAll(".vb").forEach(b=>b.onclick=()=>{
  const v=b.dataset.v;
  if(v==="iso")S.az=0;else if(v==="r90")S.az=Math.PI/2;else if(v==="r180")S.az=Math.PI;else if(v==="r270")S.az=3*Math.PI/2;
  else if(v==="seams"){S.seams=!S.seams;b.setAttribute("aria-pressed",S.seams);}
  else if(v==="guides"){S.guides=!S.guides;b.setAttribute("aria-pressed",S.guides);}
  else if(v==="explode"){S.explode=S.explode>1?1:1.7;b.setAttribute("aria-pressed",S.explode>1);}
  else if(v==="theme"){const d=isDark();document.body.className=d?"light":"dark";b.textContent=d?"Dark":"Light";}
  else if(v==="reset"){S.az=0;S.zoom=1;S.explode=1;S.sel=null;S.selS=null;S.lv.clear();S.ct.clear();
    S.tw=new Set(TOWERS.map(x=>x.k));S.seams=true;S.guides=true;
    document.querySelectorAll('[data-v="seams"],[data-v="guides"]').forEach(x=>x.setAttribute("aria-pressed","true"));
    document.querySelector('[data-v="explode"]').setAttribute("aria-pressed","false");syncUI();detail();}
  if(["iso","r90","r180","r270"].includes(v))
    document.querySelectorAll('[data-v="iso"],[data-v="r90"],[data-v="r180"],[data-v="r270"]').forEach(x=>x.setAttribute("aria-pressed",x===b));
  stats();req();
});
/* panels */
const twHost=document.getElementById("twList");
TOWERS.forEach(T=>{
  const n=T.ls.length*T.xs.length*T.ys.length,sm=CUBES.filter(c=>c.T===T&&c.seams.length).length;
  const b=document.createElement("button");b.className="tw";b.dataset.tw=T.k;b.setAttribute("aria-pressed","true");
  b.innerHTML=`<span><b>${T.name}</b><em>${T.th}</em></span><span class="k">${n} cubes<br>${sm} seam cubes</span>`;
  b.onclick=()=>{if(S.tw.has(T.k)){if(S.tw.size>1)S.tw.delete(T.k);}else S.tw.add(T.k);
    S.sel=null;S.selS=null;syncUI();stats();detail();req();};
  twHost.appendChild(b);
});
const PAIRS=[["SGAM","RAMI"],["SGAM","SCIAM"],["SGAM","SFAM"],["RAMI","SFAM"],["SGAM","RAMI","SFAM"],["SGAM","SCIAM","SFAM"]];
const pHost=document.getElementById("pairs");
PAIRS.forEach(p=>{const b=document.createElement("button");b.className="pb";b.textContent=p.join(" + ");
  b.onclick=()=>{S.tw=new Set(p);S.sel=null;S.selS=null;syncUI();stats();detail();req();};pHost.appendChild(b);});
function syncUI(){
  document.querySelectorAll(".tw").forEach(x=>x.setAttribute("aria-pressed",S.tw.has(x.dataset.tw)));
  document.querySelectorAll("#lvList .row").forEach((x,i)=>x.setAttribute("aria-pressed",!S.lv.size||S.lv.has(LV[i].p)));
  document.querySelectorAll("#ctList .row").forEach(x=>x.setAttribute("aria-pressed",!S.ct.size||S.ct.has(x.dataset.ct)));
}
const lvHost=document.getElementById("lvList");
LV.forEach(L=>{
  const has=TOWERS.filter(T=>T.ls.some(l=>l[2]===L.p));
  const b=document.createElement("button");b.className="row";b.setAttribute("aria-pressed","true");
  b.innerHTML=`<span class="dot" style="background:var(--L${L.p})"></span><span class="c">${L.c}</span>
    <span class="n">${L.th}</span><span class="m">${has.length}/4 · ${L.ct}</span>`;
  b.title=has.map(x=>x.k).join(", ");
  b.onclick=()=>{S.lv.has(L.p)?S.lv.delete(L.p):S.lv.add(L.p);syncUI();stats();req();};
  lvHost.appendChild(b);
});
const ctHost=document.getElementById("ctList");
Object.values(CT).forEach(C=>{
  const n=SEAMS.filter(s=>s[2]===C.k).length;
  const b=document.createElement("button");b.className="row";b.dataset.ct=C.k;b.setAttribute("aria-pressed","true");
  b.innerHTML=`<span class="dot" style="background:var(--c${C.k})"></span><span class="c">${C.k}</span>
    <span class="n">${C.th}</span><span class="m">${n}</span>`;
  b.title=C.d;
  b.onclick=()=>{S.ct.has(C.k)?S.ct.delete(C.k):S.ct.add(C.k);syncUI();stats();req();};
  ctHost.appendChild(b);
});
function stats(){
  const n=CUBES.filter(vis).length,sn=SEAMS.filter(seamOn).length;
  document.getElementById("stat").innerHTML=`<span>cube <b>${n}</b>/${NTOT}</span><span>coupling <b>${sn}</b>/${SEAMS.length}</span>`;
}
/* ============ detail ============ */
const det=document.getElementById("det");
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function endCard(id,role){
  const c=BY[id],T=c.T;
  return `<button class="end" data-go="${id}"><span class="tk">${role} · ${T.k}</span>
    <span class="ad">${c.lc}.${c.xc}.${c.yc}</span>
    <span class="ax">${esc(c.ln)} layer<br>${esc(T.xs[c.xi][1])}<br>${esc(T.ys[c.yi][1])}</span></button>`;
}
function seamCard(i,compact){
  const s=SEAMS[i],C=CT[s[2]],a=BY[s[0]],b=BY[s[1]],L=LV.find(l=>l.p===a.pam);
  const flag=s[6]==="asymmetric"?" · ไม่สมมาตร":s[6]==="excluded"?" · PCC เข้าร่วมไม่ได้":"";
  return `<div class="seambox" style="border-color:var(--c${s[2]})">
    <b style="color:var(--c${s[2]})">ชนิด ${s[2]} · ${esc(C.th)}${flag}</b>
    <p style="color:var(--ink)"><strong>${esc(s[3])}</strong></p>
    <p style="color:var(--ink2);margin-top:5px">${esc(s[4])}</p>
    ${compact?"":`<div class="ends">${endCard(s[0],"ต้นทาง")}<span class="arrw">↔</span>${endCard(s[1],"ปลายทาง")}</div>`}
    <div class="mini"><i>ชั้น</i><span>${L.c} ${L.n} → ${BY[s[1]].pam===a.pam?"ชั้นเดียวกัน":"L"+BY[s[1]].pam+" ของอีกตึก"}</span>
      <i>ทิศทาง</i><span>${esc(C.dir)}</span><i>ความเสี่ยง</i><span>${esc(C.risk)}</span>
      <i>ต้องมี</i><span>${esc(C.g)}</span><i>มาตรฐาน</i><span>${esc(s[5])}</span></div>
    ${compact?"":`<p style="color:var(--ink3);margin-top:8px;font-size:10.5px">${esc(C.d)}</p>`}</div>`;
}
function detail(){
  if(S.selS!==null){
    const s=SEAMS[S.selS],a=BY[s[0]],b=BY[s[1]];
    det.innerHTML=`<div class="adr">${a.T.k} ↔ ${b.T.k}</div>
      <div class="tags"><span class="tg" style="border-color:var(--c${s[2]});color:var(--c${s[2]})">coupling ${s[2]}</span>
        <span class="tg" style="border-color:var(--L${a.pam});color:var(--L${a.pam})">L${a.pam}</span>
        ${s[6]?`<span class="tg">${s[6]==="asymmetric"?"asymmetric":"excluded"}</span>`:""}</div>
      ${seamCard(S.selS,false)}`;
    return;
  }
  if(!S.sel){
    if(S.tw.size<4){
      const ts=[...S.tw].map(k=>TW[k]),rel=SEAMS.map((s,i)=>[s,i]).filter(([s])=>seamOn(s));
      const byT={};rel.forEach(([s])=>byT[s[2]]=(byT[s[2]]||0)+1);
      det.innerHTML=`<div class="adr">${ts.map(t=>t.k).join("  ×  ")}</div>
        <div class="tags">${ts.map(t=>`<span class="tg">${t.th}</span>`).join("")}</div>
        <p>รอยต่อระหว่างตึกที่เลือก <b style="color:var(--ink)">${rel.length}</b> เส้น — คลิกเพื่อดูรายละเอียด</p>
        <div class="kv">${Object.entries(byT).map(([k,v])=>`<b>ชนิด ${k}</b><span>${v} เส้น · ${esc(CT[k].th)}</span>`).join("")||"<b>—</b><span>ไม่มีรอยต่อระหว่างตึกที่เลือก</span>"}</div>
        <div class="sub">รายการ</div>
        ${rel.map(([s,i])=>{const a=BY[s[0]],b=BY[s[1]];
          return `<button class="lk" data-seam="${i}"><span class="r" style="color:var(--c${s[2]})">${s[2]} · L${a.pam}</span>
            <span class="t"><span class="a">${a.T.k}.${a.lc}.${a.xc} → ${b.T.k}.${b.lc}.${b.xc}</span>
            <span class="w">${esc(s[3])}</span></span></button>`;}).join("")}`;
      return;
    }
    det.innerHTML=`<p class="empt">คลิก <b style="color:var(--ink)">จุด</b> เพื่อดู cube · คลิก <b style="color:var(--ink)">เส้น</b> เพื่อดูรายละเอียดการเชื่อมโดยตรง<br><br>
      เลือกตึก 2–3 ตึกด้านบน เพื่อดูเฉพาะรอยต่อระหว่างคู่นั้น<br><br>
      จุดที่มีขอบสีคือ cube ที่มีรอยต่อข้ามตึก สีบอกชนิดการเชื่อม</p>`;return;
  }
  const c=BY[S.sel],T=c.T,L=LV.find(l=>l.p===c.pam);
  const xn=T.xs[c.xi][1],yn=T.ys[c.yi][1];
  const nb=nbrs(c).map(n=>{const x=BY[n.id];
    return `<button class="lk" data-go="${n.id}"><span class="r">${n.r}</span><span class="t">
      <span class="a">${x.lc}.${x.xc}.${x.yc}</span><span class="w">${esc(relWhy(c,n.r,x))}</span></span></button>`;}).join("");
  det.innerHTML=`
    <div class="adr">${T.k} · ${c.lc}.${c.xc}.${c.yc}</div>
    <div class="tags">${T.hero?`<span class="tg ${LVC[c.lvl]}">${LVN[c.lvl]}</span>`:""}
      <span class="tg" style="border-color:var(--L${c.pam});color:var(--L${c.pam})">${L.c} ${L.n}</span>
      ${c.seams.length?`<span class="tg" style="border-color:var(--c${SEAMS[c.seams[0]][2]});color:var(--c${SEAMS[c.seams[0]][2]})">${c.seams.length} coupling</span>`:""}</div>
    <h3>${esc(c.ln)} · ${esc(xn)} · ${esc(yn)}</h3>
    <p>${esc(c.lp)}</p>
    <div class="kv"><b>Tower</b><span>${esc(T.name)} — ${esc(T.th)}</span>
      <b>${esc(T.xa)}</b><span>${esc(xn)}</span><b>${esc(T.ya)}</b><span>${esc(yn)}</span>
      <b>ชั้นร่วม</b><span>${L.c} ${L.n} — เชื่อมข้ามตึกได้แบบชนิด ${L.ct} (${esc(CT[L.ct].th)})</span></div>
    ${c.seams.length?`<div class="sub">เชื่อมข้ามตึก · ${c.seams.length} เส้น</div>
      ${c.seams.map(i=>`<div data-openseam="${i}" style="cursor:pointer">${seamCard(i,true)}</div>`).join("")}`
      :`<div class="sub">เชื่อมข้ามตึก</div><p style="color:var(--ink3)">cube นี้ยังไม่มีรอยต่อข้ามสถาปัตยกรรมที่ระบุสัญญาไว้ — เชื่อมเฉพาะภายในตึกของตัวเอง</p>`}
    <div class="sub">เชื่อมภายในตึก · ${nbrs(c).length} ทิศทาง</div>${nb}`;
}
det.addEventListener("click",e=>{
  const os=e.target.closest("[data-openseam]");
  if(os){S.sel=null;S.selS=+os.dataset.openseam;detail();req();return;}
  const sm=e.target.closest("[data-seam]");
  if(sm){S.sel=null;S.selS=+sm.dataset.seam;detail();req();return;}
  const g=e.target.closest("[data-go]");
  if(g){const x=BY[g.dataset.go];if(x&&!S.tw.has(x.T.k)){S.tw.add(x.T.k);syncUI();}
    S.selS=null;S.sel=g.dataset.go;detail();stats();req();}
});
syncUI();stats();detail();draw();
</script>
</body>
</html>
